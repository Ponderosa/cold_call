[project]
name = "cold-call"
version = "0.1.0"
description = "Audio cross-route for Cold Calls art installation"
requires-python = ">=3.13"
dependencies = [
    "gpiozero>=2.0",
    "Pillow>=10.0",
    "pyalsaaudio>=0.11.0",
    "python-escpos>=3.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
