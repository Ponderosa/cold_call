# Cold Calls — Station Configuration
# Each station gets its own copy of this file.

# Station identity
name: apathy

# Cradle detection: "gpio", "button", "hybrid" (gpio+button), "keyboard" (dev)
cradle: hybrid

# Seconds between calls (1s is fine for button mode, increase for GPIO)
cooldown: 1.0

# Background audio played during conversations (file in assets/audio/)
background_audio: rain_city_loop.wav

# Each side prints from its own prompt list (filenames in assets/prompts/)
prompts:
  side_a: apathy
  side_b: apathy

# Printer settings
printer:
  enabled: true       # set false to disable printing (saves paper during testing)
  buzzer_ring: true   # use printer buzzer as part of the ring sound
  paper_alarm: false  # suppress the loud out-of-paper alarm
